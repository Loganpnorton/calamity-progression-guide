button,select{transition:background-color 100ms,border-color 100ms,box-shadow 100ms,transform 100ms}

.wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(310px,.8fr) minmax(0,1.4fr);gap:24px;max-width:1260px;padding:38px 26px 60px;margin:0 auto}

.class-picker{grid-column:2;grid-row:1;align-self:center;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.class-option{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;padding:9px 4px;min-width:0;background:#2a2532;border:2px solid #69606c;border-top-color:#85737b;border-bottom-color:#31242c;box-shadow:0 0 0 1px #08070d,2px 3px 0 #0e0a10,inset 0 0 0 1px #352f3e;color:#c5bbc7;font:600 16px/1 var(--pixel)}
.class-option .sprite{width:29px;height:29px}
.class-option.active{background:#713d32;border-color:#e4aa71;color:#fff0d3;box-shadow:0 0 0 1px #100b0e,2px 3px 0 #170e16,inset 0 0 0 1px #8b513b}
.class-option[data-class="summoner"].active{background:#294c47;border-color:#8cc3ad;box-shadow:0 0 0 1px #0c1114,2px 3px 0 #100d15,inset 0 0 0 1px #426459;color:#e3ffe9}
.class-option:hover{border-color:#f3d5a4}
.sprite{display:block;object-fit:contain;image-rendering:pixelated;flex-shrink:0;width:34px;height:34px;filter:drop-shadow(1px 2px 0 #0c091885)}
.sprite-missing{display:grid;place-items:center;width:34px;height:34px;color:var(--muted)}
.selector-panel,.recommendation{position:relative;align-self:start;border:2px solid #6d5656;border-top-color:#a38477;border-bottom-color:#44303d;border-radius:3px;box-shadow:0 0 0 2px #140d15,0 0 0 3px #412e34,5px 6px 0 #0c0912c9,inset 0 0 0 2px #2f222b;background:repeating-linear-gradient(0deg,#ffffff02 0 1px,transparent 1px 4px),#211a22}
.selector-panel{grid-column:1;padding:19px}
.selector-panel>summary{display:flex;align-items:center;gap:10px;font:600 21px/1.2 var(--pixel);color:#e2c9a3;list-style:none}
.selector-panel>summary::-webkit-details-marker{display:none}
.selector-panel>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid #a58376;border-bottom:2px solid #a58376;transform:rotate(45deg);align-self:center}
.selector-panel:not([open])>summary::after{transform:rotate(-45deg)}
.selector-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 17px}
.world-field{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}
.world-field select,.slot-control select,.search{color:#e8d8bd;background:#17131d;border:1px solid #806256;border-bottom-color:#4a3546;box-shadow:inset 1px 2px 0 #080811;padding:7px 8px}
.world-field select{max-width:160px;font-size:11px}
.clear-button{color:#bfabb0;background:#30262e;border:1px solid #82676a;border-bottom:2px solid #140e17;padding:6px 10px;font-size:10px}
.clear-button:hover{color:#f7d7a6;border-color:#c38d75}
.selector-tabs,.filters,.route-mode{display:flex;gap:5px;flex-wrap:wrap}
.selector-tabs{padding-bottom:12px;border-bottom:1px solid #4b3541}
.selector-tab,.filter,.route-mode button{padding:7px 9px;background:#332833;color:#cbb6b9;border:1px solid #745c63;border-bottom:2px solid #15101a;box-shadow:inset 0 1px #95807733;font:500 15px/1.15 var(--pixel)}
.selector-tab.active,.filter.active{color:#fff0c9;background:#644631;border-color:#c39463;border-bottom-color:#36212d}
.selector-tab:hover,.filter:hover,.route-mode button:hover{color:#ffebbf;border-color:#d8ac75}
.boss-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:15px}
.boss-option{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:89px;padding:10px 5px 9px;text-align:center;font-size:10px;line-height:1.3;cursor:pointer;border:2px solid #50434f;border-top-color:#74606b;border-right-color:#3c303f;border-bottom-color:#30232e;border-radius:2px;background:#302432;box-shadow:inset 0 0 0 1px #3f3042,1px 2px 0 #110d16;color:#d4c7cc;transition:background-color 100ms,border-color 100ms,transform 100ms}
.boss-option input{position:absolute;width:1px;height:1px;opacity:0}
.boss-option .sprite{width:36px;height:36px;transition:transform 120ms}
.boss-option>span:not(.boss-done){min-width:0;overflow-wrap:anywhere}
.boss-option:hover{border-color:#d9a975;background:#47323c;color:#fff1d5;transform:translateY(-2px)}
.boss-option:hover .sprite{transform:translateY(-2px)}
.boss-option:active{transform:translateY(1px)}
.boss-option:focus-within{outline:2px solid #ffe1a6;outline-offset:2px}
.boss-option.selected{color:#f8e4b5;background:#55402b;border-color:#b9915b;border-bottom-color:#75552f;box-shadow:inset 0 0 0 1px #836640,1px 2px 0 #100c11}
.boss-done{position:absolute;top:3px;right:4px;display:grid;place-items:center;width:16px;height:16px;font-size:12px;font-weight:800;color:#ffe6a4;background:#34281d;border:1px solid #a27c48;line-height:1}
.boss-done:empty{display:none}
.recommendation{grid-column:2;grid-row:2;padding:24px;border-top-color:#d29a70;border-left-color:#956457;border-right-color:#82574f;background:repeating-linear-gradient(0deg,#fff4d203 0 1px,transparent 1px 4px),#21191e}
.fight-header{display:flex;align-items:center;gap:12px;padding:2px 0 20px;border-bottom:2px solid #5e3e42;position:relative}
.fight-header::after{content:"";position:absolute;bottom:-3px;left:0;width:32px;height:4px;background:#dc925f;box-shadow:4px 0 #e9bf86}
.eyebrow{display:flex;align-items:center;gap:8px;font:600 15px/1 var(--pixel);color:#eca475;letter-spacing:1px;text-transform:uppercase}
.eyebrow::before{content:"";width:5px;height:5px;background:#ee7a56;box-shadow:0 0 7px #ee795663}
.fight-boss{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:13px}
.boss-tile{display:flex;align-items:center;gap:15px;font:600 34px/1.1 var(--pixel);color:#ffe0a3;min-width:0;text-shadow:2px 2px 0 #09080c}
.boss-tile .sprite{width:68px;height:68px}
.boss-tile span{overflow-wrap:anywhere}
.boss-tile:hover{color:#ffedc9}
.boss-tile:hover .sprite{filter:drop-shadow(0 0 6px #cf774c66)}
.boss-tile.mini{gap:7px;font:600 17px/1.15 var(--pixel);letter-spacing:0;color:#e5c8a7}
.boss-tile.mini .sprite{width:29px;height:29px}
.or{color:var(--muted);font-size:10px}
.gear-heading{display:flex;align-items:center;margin:20px 0 10px}
.gear-heading h2{margin:0;font:600 20px/1.2 var(--pixel);color:var(--class)}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.class-card{padding:10px 0 0;min-width:0}
.gear-row{display:grid;grid-template-columns:59px minmax(0,1fr);align-items:center;gap:9px;margin:10px 0}
.gear-field{font-size:10px;color:var(--muted)}
.gear-items,.tile-strip{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.gear-choice,.gear-bundle{display:flex;align-items:center;gap:7px;flex-wrap:wrap;max-width:100%;min-width:0}
.inline-options{gap:8px}
.gear-or,.gear-plus{color:#c9ad9e;font:500 13px/1 var(--pixel);padding:0 2px}
.gear-tile{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:49px;max-width:100%;border:2px solid #61769b;border-top-color:#a0a5c7;border-right-color:#414566;border-bottom-color:#343650;border-radius:3px;background:linear-gradient(0deg,#ffffff03 50%,transparent 50%) 0 0 / 4px 4px,#283555;box-shadow:0 0 0 1px #0d0e1d,inset 0 0 0 1px #43557d;color:#edf0ff;transition:border-color 100ms,background-color 100ms,transform 100ms,box-shadow 100ms}
.gear-tile .sprite{width:34px;height:34px;transition:transform 120ms}
.gear-tile:hover{background-color:#3b4871;border-color:#eed7a2;box-shadow:0 0 0 1px #1c1422,inset 0 0 0 1px #687393;transform:translateY(-2px);text-decoration:none;z-index:2}
.gear-tile:hover .sprite{transform:translateY(-2px)}
.gear-tile:active{transform:translateY(1px)}
.gear-caption{display:flex;flex-direction:column;gap:4px;min-width:0}
.gear-name{font-size:11px;line-height:1.25;font-weight:700;overflow-wrap:anywhere;text-shadow:0 1px #0f1123}
.gear-source{font-size:9px;line-height:1.35;color:#cbc6ac}
.accessory-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 12px;padding-top:15px;border-top:1px solid #59444a;color:var(--muted);font-size:10px}
.accessory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.accessory-slot{position:relative;min-width:0}
.accessory-slot .gear-tile{width:100%;height:100%;min-width:0;display:flex;flex-direction:column;text-align:center;gap:7px;padding:12px 5px 9px}
.accessory-slot .sprite{width:37px;height:37px}
.accessory-slot .gear-name{font-size:10px;line-height:1.3;min-width:0}
.slot-number{position:absolute;z-index:3;left:7px;top:5px;pointer-events:none;color:#b0abc5;font:500 11px/1 var(--pixel)}
.slot-control{display:flex;align-items:center;gap:8px;font-size:10px}
.slot-control select{font-size:10px;padding:4px 7px}
.buffs{display:flex;align-items:center;gap:8px;margin:18px 0 0}
.buffs>span{font-size:10px;color:var(--muted);margin-right:2px}
.buffs>a{display:grid;place-items:center;width:39px;height:39px;background:#2c324c;border:2px solid #66718b;border-right-color:#3d4059;border-bottom-color:#28263c;border-radius:2px;box-shadow:inset 0 0 0 1px #444f6a,1px 1px 0 #0c0b15;transition:transform 100ms,border-color 100ms}
.buffs>a:hover{border-color:#e6cea0;transform:translateY(-2px)}
.buffs .sprite{width:27px;height:27px}
.after-fight{margin-top:23px;padding:17px;border:1px solid #725145;border-top:2px solid #a68258;border-bottom:2px solid #32202b;border-radius:2px;background:#302128;box-shadow:inset 0 0 0 1px #49332d}
.after-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.after-heading h3{margin:0;font:500 20px/1.2 var(--pixel);color:#e9c597}
.win-button{flex-shrink:0;padding:7px 10px;font:500 15px/1.1 var(--pixel);border:1px solid #baa172;border-top-color:#e5c38b;border-bottom:2px solid #3e2b1d;box-shadow:inset 0 0 0 1px #735c3c,1px 2px 0 #161019;background:#514832;color:#ffe6ab}
.win-button:hover{background:#74603a;border-color:#ffe2a0;color:#fff4d8}
.after-fight .gear-tile{width:118px;flex-direction:column;align-items:center;text-align:center;gap:6px;min-height:77px}
.after-fight .gear-name{font-size:10px}
.then-fight{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:15px;padding-top:12px;border-top:1px solid #62473e}
.then-fight>span:first-child{font-size:10px;color:#bca598}
.why-route{margin-top:18px;font-size:11px;color:#c2aca3}
.why-route summary{width:fit-content;color:#d5baa2}
.why-route p{font-size:11px;line-height:1.7;max-width:780px}
.route-mode{margin:12px 0 3px}
.other-world-clears{margin-top:16px;font-size:10px;color:var(--muted)}
.other-world-clears .boss-picker{grid-template-columns:repeat(2,minmax(0,1fr));max-width:460px}
.all-checkpoints,.evidence{grid-column:1/-1}
.all-checkpoints{margin-top:3px}
.all-checkpoints>summary{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;font:500 20px/1.2 var(--pixel);color:#d7b48a;padding:13px 16px;background:#211a21;border:1px solid #765749;border-bottom:2px solid #21141d;box-shadow:inset 0 1px #bca47622,2px 3px 0 #0a0910}
.all-checkpoints>summary::-webkit-details-marker{display:none}
.all-checkpoints>summary::before{content:"";width:7px;height:7px;flex-shrink:0;border-top:2px solid #c3976a;border-right:2px solid #c3976a;transform:rotate(45deg)}
.all-checkpoints[open]>summary::before{transform:rotate(135deg)}
.all-checkpoints>summary:hover{color:#ffdaa0;border-color:#bc8e61}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0}
.search{padding:9px 12px;font-size:11px;min-width:210px}
.stage-list{display:grid;gap:9px}
.stage{border:1px solid #63505b;border-radius:2px;background:#231c28;overflow:hidden;scroll-margin-top:20px;box-shadow:2px 3px 0 #0c0a13}
.stage.current-stage{border-color:#c59562}
.stage-head{display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer;padding:13px 16px}
.stage-head::-webkit-details-marker{display:none}
.stage-head:hover{background:#392731}
.stage-name{font:500 20px/1.2 var(--pixel);flex:1;min-width:0;color:#ddc2ad}
.chev{font-size:12px;color:#c08e72}
.stage-main{padding:2px 16px 16px}
.stage-main .class-card{padding-top:0}
.empty{padding:24px;color:var(--muted);text-align:center}
.evidence{margin-top:-4px;color:#ab9397;font-size:10px}
.evidence>summary{cursor:pointer;width:fit-content}
.evidence p{max-width:850px}
.evidence a{text-decoration:underline;color:#c4a794}
.evidence a:hover{color:#ffdaa2}
details>summary{user-select:none}

function classItemAvailable(name){

function availableBuild(i,cl){
 const b=stages[i][cl],result={},locked=[];
 for(const field of ['weapon','armor','access','whip']){
  if(!b[field]){result[field]=null;continue;}
  const primary=items(b[field],field);
  for(const name of primary){const missing=missingFor(name);if(!classItemAvailable(name))locked.push({name,missing});}
  let options=primary.filter(classItemAvailable);
  if(field==='weapon')options=options.concat(items(b.alt,'weapon').filter(classItemAvailable));
  if(!options.length){
   for(let prev=i-1;prev>=0;prev--){
    options=items(stages[prev][cl][field],field).filter(classItemAvailable);
    if(field==='weapon')options=options.concat(items(stages[prev][cl].alt,'weapon').filter(classItemAvailable));
    if(options.length)break;
   }
  }
  options=[...new Set(options)];
  result[field]=options.length?options.join(field==='access'?' · ':' / '):null;
  if(field==='weapon'&&options.length){result.weapon=options[0];result.alt=options[1]||null;}
 }
 return {build:result,locked};
}

}

function afterFight(plan,onlyClass=null){
 if(plan.next.length!==1)return null;
 const candidates=plan.next[0].split(' / ');if(candidates.length>1&&worldEvil==='Either')return null;
 const boss=candidates[worldEvil==='Crimson'?candidates.length-1:0];
 const before=currentFightGear(plan),saved=defeated,mode=routeMode;
 try{
  // Preview the same route the user chose. Do not silently switch routes after a win.
  defeated={...defeated,[canonical(boss)]:true};
  const next=progressionPlan(),after=currentFightGear(next),found=new Map();
  for(const cl of onlyClass?[onlyClass]:classNames){
   const old=new Set([...['weapon','alt','armor','whip'].flatMap(field=>items(before[cl].build[field],field)),...before[cl].access.map(x=>x.name)]);
   const changed=after[cl].access.filter(x=>!old.has(x.name));
   const accessory=changed.find(x=>x.role===classDefs[cl].role)||changed[0];
   for(const name of [...after[cl].primary,...(accessory?[accessory.name]:[])]){
    if(old.has(name)||!worldAllowsItem(name))continue;
    if(found.has(name)){found.get(name).role='Both';continue;}
    found.set(name,{name,role:classLabel(cl)});
   }
  }
  // A detour can show an earlier minimum setup. Don't present that setup as
  // newly unlocked loot or an upgrade over the gear for the previous fight.
  return {boss,next:next.next,gear:next.displayTier<plan.displayTier?[]:[...found.values()]};
 }finally{defeated=saved;routeMode=mode;}
}
function renderRecommendation(){
 const plan=progressionPlan(),build=planBuild(plan,selectedClass).build,later=afterFight(plan,selectedClass);
 let html='<div class="fight-header"><div>'+(plan.next.length?'<div class="eyebrow">Next boss'+(plan.tryNow?' · Harder':'')+'</div>':'')+'<div class="fight-boss">'+(plan.next.length?plan.next.map(n=>bossTile(n)).join('<span class="or">or</span>'):'<strong>All clear ✓</strong>')+'</div></div></div>';
 html+='<div class="gear-heading"><h2>'+(!plan.next.length?'Endgame gear':'Equip first')+'</h2></div><div class="cards">'+classCard(build)+'</div>';
 const classBuffs={melee:['Swiftness Potion'],summoner:['Summoning Potion',...(has('Skeletron')?['Bewitching Table']:[])],ranger:['Ammo Reservation Potion',...([build.weapon,build.alt].some(n=>['arrow','basic-arrow'].includes(rangerAmmoTypes[n]))?['Archery Potion']:[])],mage:['Magic Power Potion','Mana Regeneration Potion',currentTier()>=6?'Super Mana Potion':'Mana Potion'],rogue:['Shadow Potion','Swiftness Potion']};
 const buffs=['Ironskin Potion','Regeneration Potion',...classBuffs[selectedClass]];
 html+='<div class="buffs"><span>Buffs</span>'+buffs.map(n=>'<a href="'+wiki(n)+'" target="_blank" rel="noopener noreferrer" title="'+esc(n)+'" aria-label="'+esc(n)+'">'+sprite(n)+'</a>').join('')+'</div>';
 if(later){
  html+='<section class="after-fight" aria-label="Upgrades after this fight"><div class="after-heading"><h3>After winning</h3><button class="win-button" data-mark-boss="'+esc(later.boss)+'" aria-label="Mark '+esc(later.boss)+' defeated">Defeated ✓</button></div>'+(later.gear.length?'<div class="tile-strip">'+later.gear.map(x=>gearTile(x.name,{tip:'How to get '+x.name})).join('')+'</div>':'')+(later.next.length?'<div class="then-fight"><span>Then</span>'+later.next.map(n=>bossTile(n,true)).join('<span class="or">or</span>')+'</div>':'<div class="then-fight">All clear ✓</div>')+'</section>';
 }
 const shared=sharedStepReason(plan);
 if(plan.catchup||shared){
  const reason=plan.tryNow?'Earlier upgrades are missing.':plan.catchup?plan.gearTier===1?(['melee','ranger','summoner'].includes(selectedClass)?'Unlocks Hellstone gear.':'Unlocks Meteorite and crafting materials.'):plan.gearTier===2?'Unlocks Aerialite gear.':'Unlocks Daedalus gear.':'';
  const alternative=plan.tryNow?plan.recommended[0]:plan.goal[0];
  html+='<details class="why-route"><summary>Why this boss?</summary><p>'+esc([reason,shared].filter(Boolean).join(' '))+'</p>'+(plan.catchup?'<div class="route-mode"><button data-plan-mode="'+(plan.tryNow?'recommended':'advance')+'">Fight '+esc(shortBoss(alternative))+' instead</button></div>':'')+'</details>';
 }
 document.querySelector('#recommendation').innerHTML=html;
}
function render(){
 const term=state.term.trim().toLowerCase(),recommendedTier=progressionPlan().displayTier;
 const visible=stages.map((s,i)=>({s,i})).filter(({s,i})=>{
  if(state.era!=='All'&&s.era!==state.era)return false;
  const hay=[s.era,...s.bosses.map(worldBossChoice).filter(Boolean),...Object.entries(s[selectedClass]).flatMap(([field,value])=>items(value,field).filter(worldAllowsItem)),...accessoryLoadout(i,selectedClass,true).map(x=>x.name)].join(' ').toLowerCase();
  return !term||hay.includes(term);
 });
 document.querySelector('#stage-list').innerHTML=visible.map(({s,i})=>{
  const names=s.bosses.map(worldBossChoice).filter(Boolean).map(n=>n.split(' / ').map(x=>shortBoss(canonical(x))).join(' / '));
  return '<details id="checkpoint-'+i+'" class="stage '+(i===recommendedTier?'current-stage':'')+'" '+(term||i===recommendedTier?'open':'')+'><summary class="stage-head"><div class="stage-name">'+esc(names.join(' · '))+'</div><span class="chev" aria-hidden="true">⌄</span></summary><div class="stage-main"><div class="cards">'+classCard(s[selectedClass],i,true)+'</div></div></details>';
 }).join('')||'<div class="empty">No matching gear or bosses.</div>';
 renderSelector();renderRecommendation();
}
document.querySelector('#recommendation').addEventListener('change',e=>{
 if(e.target.id==='accessory-slots'){
  const n=Number(e.target.value);if(![5,6,7].includes(n))return;selectedSlots=n;
  try{localStorage.setItem(bossKey+'-slots',String(n));}catch(err){}
  render();
 }
});
document.querySelector('#class-picker').addEventListener('click',e=>{
 const button=e.target.closest('[data-class]');if(button)setClass(button.dataset.class);
});

selectorEra=stages[currentTier()].era;render();
</script></body></html>
